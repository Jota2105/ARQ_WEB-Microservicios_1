name: laboratorio-microservicios

services:
  productos:
    build:
      context: ./productos
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DB_PATH: /data/productos.db
    volumes:
      - datos_productos:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pedidos:
    build:
      context: ./pedidos
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      DB_PATH: /data/pedidos.db
      PRODUCTOS_URL: http://productos:8000
    volumes:
      - datos_pedidos:/data
    depends_on:
      productos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  datos_productos:
  datos_pedidos:
